# Databricks Asset Bundle — runs the storm-alert pipeline as a DBX job.
#
# There is one live job (the `prod` target, the default). It handles both the
# scheduled runs and any ad-hoc manual runs (override params per run):
#
#   databricks bundle deploy -p default                                  # deploy prod
#   databricks bundle run storm_alert -p default                         # manual run (live params)
#   databricks bundle run storm_alert -p default --params issued_time=2025-10-24T18
#   databricks bundle run storm_alert -p default --params test_email=True,dry_run=True
#
# The `dev` target is for feature work: deploy it on-demand pointed at a feature
# branch — it auto-pauses the schedule and uses the test list, so it never
# competes with prod. Tear it down when the feature merges:
#
#   databricks bundle deploy  -t dev -p default --var git_branch=my-feature
#   databricks bundle run     storm_alert -t dev -p default              # manual test run
#   databricks bundle destroy -t dev -p default
#
# The job clones this repo (source: GIT) at ${var.git_branch} and runs the thin
# wrapper databricks/run_alert_job.py, which shells out to pipelines/run_alert.py.
# Pipeline code (pipelines/, src/) stays pure Python and is unchanged.
#
# Bundle docs: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: ds-storms-alerts

# The job runs entirely from source: GIT, so the deploy-time file sync isn't
# used at runtime. Exclude the large data/*.parquet files — uploading them is
# unnecessary and was timing out (HTTP 408) on the bigger boundary files.
sync:
  exclude:
    - "data/**"

variables:
  existing_cluster_id:
    # Dev target only. Prod runs on ephemeral Job Compute (see the prod target);
    # a scheduled job pinned to a personal cluster breaks when that cluster goes
    # away. Same split as ds-storms-pipeline.
    description: Interactive cluster the DEV target runs on (carries the DSCI_AZ_* env vars)
    default: "0515-161935-i2w5mxhc"
  git_branch:
    description: Branch the job pulls the pipeline from
    default: main
  # Send-mode switches (the DBX analog of the GHA repo vars). Flip without
  # editing files via, e.g.:  databricks bundle deploy -t prod --var test_email=False
  dry_run:
    description: '"True" = generate but skip send/write; "False" = actually send'
    default: "False"
  test_email:
    # Default is the safe test list; the prod target overrides to "False" (see below).
    description: '"True" = Tristan-only test list; "False" = real per-country subscriber lists'
    default: "True"
  stage:
    # ocha-stratus DB/blob stage the pipeline reads exposure data from. Currently
    # "dev" for all targets — that's where the storm pipeline writes (the cluster
    # has no prod-write). Flip a target to "prod" once prod data lands; keeping it
    # a variable means the data source can't silently disagree with the target.
    description: '"dev" | "prod" — DB/blob stage to read from'
    default: "dev"

targets:
  prod:
    # The live job (default target). Production mode runs the schedule as defined.
    # (A shared root_path can be revisited when cutting over off a personal
    # identity.)
    mode: production
    default: true
    workspace:
      profile: default
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    # Explicit for production mode, and pins the SINGLE_USER job cluster's
    # identity (mirrors ds-storms-pipeline).
    run_as:
      user_name: adm.tdowning@global.un.org
    variables:
      # Live: send to the real per-country subscriber lists (not the test list).
      # Still reads the DEV database (stage var defaults to "dev").
      test_email: "False"
    # Prod runs on an ephemeral Job Compute cluster, not the personal
    # interactive cluster.
    resources:
      jobs:
        storm_alert:
          job_clusters:
            - job_cluster_key: alert_cluster
              new_cluster:
                # Job Compute policy (000C79D951EAF0D6): fixes cluster_type=job,
                # num_workers=1, STANDARD engine, and injects all dsci secret
                # env vars (DEV+PROD DB/blob) — so no spark_env_vars block.
                # Listmonk creds are not in the policy; the wrapper pulls them
                # from the dsci scope via dbutils.secrets at run time.
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                spark_version: "18.2.x-scala2.13"
                # DS4_v2 (28 GB) matches the personal cluster the job ran on
                # before (also DS4_v2), so this isn't a step down. The Python
                # runs on the driver; the policy-mandated worker idles.
                node_type_id: "Standard_DS4_v2"
                num_workers: 1
                data_security_mode: SINGLE_USER
          tasks:
            - task_key: run_alert
              job_cluster_key: alert_cluster
  dev:
    # On-demand feature-branch testing only — deploy with --var git_branch=<branch>.
    # Development mode auto-pauses the schedule and prefixes the job name
    # ("[dev <user>] Storm Alert"), and test_email defaults to True (test list),
    # so it never competes with the live prod job. Destroy when done.
    mode: development
    workspace:
      profile: default
    # Dev runs on the personal interactive cluster (instant start, no per-run
    # library install) — fine for on-demand feature testing.
    resources:
      jobs:
        storm_alert:
          tasks:
            - task_key: run_alert
              existing_cluster_id: ${var.existing_cluster_id}

resources:
  jobs:
    storm_alert:
      name: Storm Alert
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-storms-alerts.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      schedule:
        # 03:50 / 09:50 / 15:50 / 21:50 UTC — ~50 min after each NHC advisory.
        # Was :30, which raced the upstream NHC chain: its :00 run lands
        # exposure ~:15-:25 and its :30 WSP-retry can update WSP tables right
        # as the alert reads them (an upstream hiccup then left the email a
        # full issuance behind — Dolly, 2026-08-27). :50 clears both runs.
        # No explicit pause_status: prod (production mode) runs it; the dev
        # target (development mode) auto-pauses it. Setting UNPAUSED here would
        # override dev's auto-pause and make dev fire too — don't.
        quartz_cron_expression: "0 50 3,9,15,21 * * ?"
        timezone_id: UTC

      max_concurrent_runs: 1

      # Failure alerting: the Jul 2026 openpyxl incident ran 12 consecutive
      # silent failures (~3 days, through an active storm) before anyone
      # noticed. Every failed run now emails immediately.
      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true

      parameters:
        - name: issued_time      # YYYY-MM-DDTHH backfill override; "" → realtime
          default: ""
        - name: test_email       # send-mode switch (see variables block)
          default: ${var.test_email}
        - name: dry_run          # send-mode switch (see variables block)
          default: ${var.dry_run}
        - name: stage            # DB/blob stage to read from (see variables block)
          default: ${var.stage}

      tasks:
        # Compute (existing_cluster_id vs job_cluster_key) is supplied per
        # target above: dev -> personal cluster; prod -> ephemeral job cluster.
        - task_key: run_alert
          spark_python_task:
            python_file: databricks/run_alert_job.py
            source: GIT
            parameters:
              - "{{job.parameters.issued_time}}"
              - "{{job.parameters.test_email}}"
              - "{{job.parameters.dry_run}}"
              - "{{job.parameters.stage}}"
          # The prod job cluster is created fresh every run, so this list is
          # the ENTIRE non-DBR environment — nothing is hand-installed on it.
          # Keep it in step with pyproject [project.dependencies]. (The first
          # Job Compute test run, 2026-09-10, died on `No module named
          # openpyxl`: it had only ever been installed by hand on the personal
          # cluster.)
          libraries:
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi:
                package: "ocha-relay @ git+https://github.com/OCHA-DAP/ocha-relay.git@2d4870749faa4235e65164b731e0a574a2e209ab"
            - pypi: { package: "matplotlib>=3.9" }
            - pypi: { package: "geopandas" }
            - pypi: { package: "openpyxl>=3.1.5" }
            - pypi: { package: "scipy>=1.17.1" }
            - pypi: { package: "databricks-sdk" }
